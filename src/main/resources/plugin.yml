name: NexusUniverseKairos
version: 0.1.0
main: com.nexusuniverse.kairos.KairosPlugin
api-version: '1.21'
author: Nexus Universe
description: Server-side Kairos and Verticon framework for Nexus Universe.
commands:
  kairos:
    description: Interact with the Kairos system.
    usage: /kairos
  verticon:
    description: Manage custom Verticon characters.
    usage: /verticon <create|list|info|assign>
permissions:
  kairos.admin:
    default: op
  verticon.admin:
    default: op
